version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: citable-postgres
    environment:
      POSTGRES_DB: citable
      POSTGRES_USER: citable
      POSTGRES_PASSWORD: citable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: citable-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    container_name: citable-api
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://citable:citable@postgres:5432/citable
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
    container_name: citable-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000

volumes:
  pgdata:
