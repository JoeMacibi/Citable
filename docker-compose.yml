version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: citable-postgres
    environment:
      POSTGRES_DB: citable
      POSTGRES_USER: citable
      POSTGRES_PASSWORD: citable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: citable-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: citable-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ./backend
    container_name: citable-backend
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/citable
      SPRING_DATASOURCE_USERNAME: citable
      SPRING_DATASOURCE_PASSWORD: citable
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_REDIS_HOST: redis
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./web
    container_name: citable-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080

volumes:
  pgdata:
